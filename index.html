<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Scale</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="menu">
      <div class="menu-bg"></div>
      <div class="menu-inner">
        <div class="menu-left">
          <header class="menu-head">
            <h1 class="title" aria-label="Scale"><span aria-hidden="true" style="--i:0">S</span><span aria-hidden="true" style="--i:1">C</span><span aria-hidden="true" style="--i:2">A</span><span aria-hidden="true" style="--i:3">L</span><span aria-hidden="true" style="--i:4">E</span></h1>
            <p class="sub">A living, destructible city. Every seed is a different place.</p>
            <p class="community">Official subreddit: <a href="https://www.reddit.com/r/Scale_The_Game/" target="_blank" rel="noopener">r/Scale_The_Game</a></p>
          </header>
          <div class="menu-resume" id="menuResume"></div>
        </div>
        <div class="panel menu-new">
          <h2>New city</h2>
          <div class="city-row">
            <label>Seed <input id="seed" type="text" autocomplete="off" /></label>
            <div class="name"><span id="cityName"></span></div>
          </div>
          <label>Size <input id="size" type="range" min="0" max="1" step="0.01" /></label>
          <div class="hint"><span id="sizeLabel"></span></div>
          <div class="modes" id="modes">
            <div class="modes-head">Game mode</div>
            <button type="button" class="mode" data-mode="normal"><span class="mode-name">Normal</span><span class="mode-desc"></span></button>
            <button type="button" class="mode" data-mode="sandbox"><span class="mode-name">Sandbox</span><span class="mode-desc"></span></button>
          </div>
          <button id="start">Enter the city</button>
        </div>
      </div>
    </div>
    <div id="loading"><div class="box"><div id="loadMsg">Loading</div><div class="bar"><div id="loadBar"></div></div></div></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
